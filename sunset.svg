<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sunset over the ocean</title>
  <desc id="desc">A warm sunset with glowing sky, ocean reflection, and distant mountains.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f225f"/>
      <stop offset="38%" stop-color="#f07b5a"/>
      <stop offset="62%" stop-color="#ffbf6b"/>
      <stop offset="100%" stop-color="#ffd89a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b5d8a"/>
      <stop offset="100%" stop-color="#17334d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="46%" r="20%">
      <stop offset="0%" stop-color="#fff7d1" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffcf7a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ff9f55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd37f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffd37f" stop-opacity="0"/>
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#sky)"/>
  <rect y="520" width="1200" height="280" fill="url(#sea)"/>

  <circle cx="600" cy="360" r="120" fill="#ffd98e"/>
  <circle cx="600" cy="360" r="210" fill="url(#sunGlow)"/>

  <path d="M0 520 C220 460, 360 480, 520 520 S860 560, 1200 510 L1200 580 L0 580 Z" fill="#2a3b58" opacity="0.85"/>
  <path d="M0 560 C180 525, 330 540, 500 565 S910 610, 1200 575 L1200 640 L0 640 Z" fill="#1f2f49" opacity="0.95"/>

  <polygon points="560,520 600,800 640,520" fill="url(#reflection)" filter="url(#soften)"/>
  <polygon points="540,520 600,800 660,520" fill="url(#reflection)" opacity="0.5"/>

  <g opacity="0.22">
    <path d="M0 585 C120 600, 240 570, 360 585 C480 600, 600 570, 720 585 C840 600, 960 570, 1080 585 C1140 593, 1170 592, 1200 590" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M0 635 C140 650, 280 620, 420 635 C560 650, 700 620, 840 635 C980 650, 1120 620, 1200 630" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M0 690 C120 705, 240 675, 360 690 C480 705, 600 675, 720 690 C840 705, 960 675, 1080 690 C1140 698, 1170 697, 1200 695" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g fill="#ffffff" opacity="0.25">
    <ellipse cx="260" cy="205" rx="82" ry="18"/>
    <ellipse cx="305" cy="210" rx="55" ry="14"/>
    <ellipse cx="925" cy="165" rx="88" ry="20"/>
    <ellipse cx="975" cy="172" rx="52" ry="14"/>
  </g>
</svg>
