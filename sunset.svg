  <rect width="800" height="450" fill="url(#sky)"/>

  <circle cx="400" cy="230" r="70" fill="url(#sun)"/>
  <rect x="300" y="240" width="200" height="130" fill="url(#glow)"/>

  <rect y="280" width="800" height="170" fill="url(#sea)"/>

  <path d="M0 300 C120 290 240 310 360 300 C480 290 600 310 720 300 C760 298 780 299 800 300 L800 450 L0 450 Z"
